[tool.uv.workspace]
members = [
  "packages/alephantai",
  "packages/langchain-alephantai",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "packages/alephantai/tests",
  "packages/langchain-alephantai/tests",
]
pythonpath = [
  "packages/alephantai/src",
  "packages/langchain-alephantai/src",
]

[tool.ruff]
line-length = 100
target-version = "py310"
